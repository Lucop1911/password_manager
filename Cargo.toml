[package]
name = "password_manager"
version = "0.1.0"
edition = "2024"
description = "A secure password manager built with Rust"
authors = ["Luca <lucop1911@gmail.com>"]
license = "MIT"
repository = "https://github.com/Lucop1911/password_manager"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
base64 = "0.23.0"
rand = "0.9.5"
aes-gcm = "0.11.0"
argon2 = "0.5"
rfd = "0.17.2"
dirs = "6.0.0"
rusqlite = {version = "0.40.1", features = ["bundled-sqlcipher-vendored-openssl"]}

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true
debug = false
overflow-checks = false

[build-dependencies]
winres = "0.1"

[package.metadata.winres]
ProductName = "Password Manager"
FileDescription = "Secure Password Manager"
LegalCopyright = "Copyright (c) 2025"
ProductVersion = "1.0.0"
FileVersion = "1.0.0"


[package.metadata.bundle]
name = "Password Manager"
identifier = "com.luca.password-manager"
icon = "./icon.ico"
version = "1.0.0"
copyright = "Copyright (c) 2025"
category = "Utility"
short_description = "Secure Password Manager"
long_description = "A secure password manager built with Rust"
